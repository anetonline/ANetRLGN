# ANetRLogin destination allowlist
# The DOS door supplies ONLY a destination ID and caller identity.
# Host/port are resolved here by the Win32 bridge so a caller cannot turn
# the door into an arbitrary TCP/RLogin proxy.
#
# RLogin is plaintext. Prefer servers you control, private/VPN paths, or
# destinations where interception risk is acceptable.

# Make Multiple RLOGIN Connections
#
# [destination ANETBBS]
# name=A-Net Online ANetBBS
# host=bbs.a-net.fyi
# port=5132

[destination ANETGAMES]
name=A-Net Game Server
host=game.a-net-online.lol
port=513

# BBS-style RLogin servers commonly repurpose these RFC1282 fields.
# Supported macros: %USER% and %ALIAS%
client_user=%USER%
server_user=%ALIAS%
term=ansi/115200
expect_ack=1
