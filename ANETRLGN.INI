# ANetRLogin destination allowlist
# The DOS door supplies ONLY a destination ID and caller identity.
# Host/port are resolved here by the Win32 bridge.
#
# RLogin is plaintext. Prefer servers you control, private/VPN paths, or
# destinations where interception risk is acceptable.

[general]
# 1 = automatically open ANETRLV.EXE for each active node.
# 0 = disable the separate local ANSI/CP437 viewer.
local_viewer=1

# Default local-viewer geometry for destinations that do not override it.
viewer_cols=80
viewer_rows=25

[destination ANETGAMES]
name=A-Net Game Server
host=game.a-net-online.lol
port=513

# Synchronet-compatible tested mapping: PASSWORD first, USER second.
# Supported macros: %USER% %ALIAS% %PASSWORD%
client_user=%PASSWORD%
server_user=%USER%
term=ansi/115200
expect_ack=1

# A-Net Game Server uses the standard 80x25 terminal geometry.
# The viewer is independent of the caller and can use a destination-specific size.
viewer_cols=80
viewer_rows=25
