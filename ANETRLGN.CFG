; ANetRLogin OpenDoors configuration for DOS BBSes
;
; BBSDir is where your BBS software writes the live DOOR.SYS.
; DoorDir is ANetRLogin's shared DOS/Win32 IPC spool directory.
;
; Adjust to your BBS directories. Do not put the dropfile in the path\to\dropfile
; DoorDir is the directory ANetRLGN is in


BBSDir C:\path\to\dropfile
DoorDir C:\path\to\ANETRLGN

; OpenDoors normally obtains COM/FOSSIL settings from DOOR.SYS.
; Leave FossilPort/LockedBPS unset unless your installation needs overrides.

DisableLogging
